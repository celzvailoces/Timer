<script>
    var timeLeft = 0;
    var timerElement = document.getElementById('timer');
    var startButton = document.getElementById('startButton');
    var stopButton = document.getElementById('stopButton');
    var resetButton = document.getElementById('resetButton');
    var settingsButton = document.getElementById('settingsButton');
    var settingsModal = document.getElementById('settingsModal');
    var saveButton = document.getElementById('saveButton');
    var timerInterval;
    var modalVisible = false;
    var alarmSound = document.getElementById('alarmSound');
    var displayMode = 'hours'; // 'seconds' = SS, 'minutes' = MM:SS, 'hours' = HH:MM:SS

    // Add event listener for key press
    document.addEventListener('keydown', function(event) {
        if (event.altKey && event.key === '1') {
            // Toggle fullscreen when Alt+1 is pressed
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        } else if (event.altKey && event.key === '2') {
            // Exit fullscreen when Alt+2 is pressed
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }
    });


    settingsButton.addEventListener('click', function() {
        if (modalVisible) {
            settingsModal.style.display = 'none';
        } else {
            settingsModal.style.display = 'block';
        }
        modalVisible = !modalVisible; // Toggle modal visibility
    });

    // Close the modal when the user clicks anywhere outside of it
    window.addEventListener('click', function(event) {
        if (event.target == settingsModal) {
            settingsModal.style.display = 'none';
            modalVisible = false;
        }
    });

    function formatTime(totalSeconds) {
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        var hoursStr = ('0' + hours).slice(-2);
        var minutesStr = ('0' + minutes).slice(-2);
        var secondsStr = ('0' + seconds).slice(-2);

        if (displayMode === 'hours') {
            return hoursStr + ':' + minutesStr + ':' + secondsStr;
        } else if (displayMode === 'minutes') {
            return minutesStr + ':' + secondsStr;
        } else {
            return secondsStr;
        }
    }

    function getResetDisplay() {
        if (displayMode === 'hours') return '00:00:00';
        if (displayMode === 'minutes') return '00:00';
        return '00';
    }

    function renderDisplay() {
        var formatted = (timeLeft === 0 && !timerInterval) ? getResetDisplay() : formatTime(timeLeft);
        timerElement.textContent = formatted;
        if (pipWindow && !pipWindow.closed) {
            var el = pipWindow.document.getElementById('pip-timer');
            if (el) el.textContent = formatted;
        }
    }

    function updateTimer() {
        renderDisplay();
    }

    function tickTimer() {
        if (timeLeft > 0) {
            timeLeft--;
            renderDisplay();
            if (timeLeft === 0) {
                stopTimer();
                playAlarm();
            }
        } else {
            stopTimer();
            playAlarm();
        }
    }

    function startTimer() {
        if (timeLeft > 0 && !timerInterval) {
            renderDisplay();
            timerInterval = setInterval(tickTimer, 1000);
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function resetTimer() {
        stopTimer();
        timeLeft = 0;
        renderDisplay();
        stopAlarm();
    }

    function setTimerValue(hours, minutes, seconds) {
        var h = parseInt(hours) || 0;
        var m = parseInt(minutes) || 0;
        var s = parseInt(seconds) || 0;
        var totalSeconds = (h * 3600) + (m * 60) + s;
        if (totalSeconds >= 1) {
            if (h > 0) {
                displayMode = 'hours';
            } else if (m > 0) {
                displayMode = 'minutes';
            } else {
                displayMode = 'seconds';
            }
            stopTimer();
            timeLeft = totalSeconds;
            renderDisplay();
            stopAlarm();
            document.getElementById('timer-hours').value = h;
            document.getElementById('timer-minutes').value = m;
            document.getElementById('timer-seconds').value = s;
            return true;
        } else {
            alert('Please enter a valid timer value (at least 1 second).');
            return false;
        }
    }

    startButton.addEventListener('click', startTimer);
    stopButton.addEventListener('click', stopTimer);
    resetButton.addEventListener('click', resetTimer);

    saveButton.addEventListener('click', function() {
        var h = document.getElementById('timer-hours').value;
        var m = document.getElementById('timer-minutes').value;
        var s = document.getElementById('timer-seconds').value;
        if (setTimerValue(h, m, s)) {
            settingsModal.style.display = 'none';
            modalVisible = false;
        }
    });

    // Function to handle key press events
    document.addEventListener('keydown', function(event) {
        if (event.key.toLowerCase() === 's') {
            settingsButton.click(); // Trigger click event on settings button
        }
    });

    // Shorter alarm: plays for 3 seconds then stops automatically
    var alarmTimeout = null;

    function playAlarm() {
        try {
            alarmSound.currentTime = 0;
            alarmSound.play().catch(function(e) { console.log('Audio playback prevented:', e); });
        } catch (e) {
            console.log(e);
        }
        clearTimeout(alarmTimeout);
        alarmTimeout = setTimeout(function() {
            stopAlarm();
        }, 3000); // Shorter alarm: stops automatically after 3 seconds
    }

    function stopAlarm() {
        clearTimeout(alarmTimeout);
        try {
            alarmSound.pause();
            alarmSound.currentTime = 0;
        } catch (e) {}
    }

    // Function to toggle fullscreen on small devices
    var smallDeviceButton = document.getElementById('smalldevice');
    smallDeviceButton.addEventListener('click', function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    // ===== Picture-in-Picture Overlay =====
    var overlayButton = document.getElementById('overlayButton');
    var pipWindow = null;
    var pipCanvas = null;
    var pipVideo = null;
    var pipRenderInterval = null;

    overlayButton.addEventListener('click', function() {
        // Try Document PiP first (Chrome 116+), then fall back to Video PiP
        if ('documentPictureInPicture' in window) {
            openDocumentPiP();
        } else if (document.pictureInPictureEnabled) {
            openVideoPiP();
        } else {
            // Fallback: open a small always-on-top-style popup window
            openPopupOverlay();
        }
    });

    // === Method 1: Document Picture-in-Picture (best quality with buttons & settings) ===
    async function openDocumentPiP() {
        try {
            pipWindow = await documentPictureInPicture.requestWindow({
                width: 420,
                height: 220
            });

            var style = pipWindow.document.createElement('style');
            style.textContent = `
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    background: linear-gradient(-45deg, #7DDA58, #16898A, #50CA45, #CECECE);
                    background-size: 400% 400%;
                    animation: gradient 15s ease infinite;
                    height: 100vh;
                    overflow: hidden;
                    font-family: 'Segoe UI', Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    padding: 8px 12px;
                    user-select: none;
                }
                @keyframes gradient {
                    0% { background-position: 0% 50%; }
                    50% { background-position: 100% 50%; }
                    100% { background-position: 0% 50%; }
                }
                .pip-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    width: 100%;
                    flex-shrink: 0;
                }
                .pip-title {
                    font-size: 11px;
                    font-weight: bold;
                    letter-spacing: 1px;
                    color: rgba(255,255,255,0.85);
                }
                .pip-settings-btn {
                    background: rgba(255,255,255,0.2);
                    border: 1px solid rgba(255,255,255,0.4);
                    color: white;
                    border-radius: 4px;
                    padding: 3px 8px;
                    font-size: 11px;
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .pip-settings-btn:hover {
                    background: rgba(255,255,255,0.35);
                    border-color: white;
                }
                #pip-main-view {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    width: 100%;
                    min-height: 0;
                }
                #pip-timer {
                    flex: 1;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: clamp(48px, 18vw, 76px);
                    font-weight: bold;
                    color: white;
                    text-shadow: 0 0 14px rgba(0,0,0,0.4);
                    text-align: center;
                    line-height: 1;
                    width: 100%;
                    margin: 0;
                }
                .pip-controls {
                    display: flex;
                    justify-content: center;
                    gap: 10px;
                    margin-bottom: 2px;
                    flex-shrink: 0;
                }
                .pip-btn {
                    border: none;
                    border-radius: 5px;
                    color: white;
                    font-weight: bold;
                    font-size: 13px;
                    padding: 6px 16px;
                    cursor: pointer;
                    transition: transform 0.1s, opacity 0.2s;
                }
                .pip-btn:active {
                    transform: scale(0.96);
                }
                .btn-start { background-color: #00827F; }
                .btn-start:hover { background-color: #22CE83; }
                .btn-stop { background-color: #F75D59; }
                .btn-stop:hover { background-color: #FD1C03; }
                .btn-reset { background-color: #FBB917; }
                .btn-reset:hover { background-color: #FFA600; }

                /* Settings View in PiP */
                #pip-settings-view {
                    display: none;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    flex: 1;
                    gap: 6px;
                }
                .pip-inputs-row {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                }
                .pip-input-col {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
                .pip-input-col label {
                    font-size: 10px;
                    color: white;
                    font-weight: bold;
                    margin-bottom: 2px;
                }
                .pip-input-col input {
                    width: 48px;
                    height: 32px;
                    text-align: center;
                    font-size: 16px;
                    font-weight: bold;
                    border: 2px solid #b2f308;
                    border-radius: 5px;
                    background: white;
                    color: #222;
                }
                .pip-colon {
                    font-size: 20px;
                    font-weight: bold;
                    color: white;
                    margin-top: 14px;
                }
            `;
            pipWindow.document.head.appendChild(style);

            pipWindow.document.body.innerHTML = `
                <div class="pip-header">
                    <span class="pip-title">COUNTDOWN TIMER</span>
                    <button id="pip-toggle-settings" class="pip-settings-btn">&#9881; Set Time</button>
                </div>

                <div id="pip-main-view">
                    <div id="pip-timer">${timerElement.textContent}</div>
                    <div class="pip-controls">
                        <button id="pip-start" class="pip-btn btn-start">Start</button>
                        <button id="pip-stop" class="pip-btn btn-stop">Stop</button>
                        <button id="pip-reset" class="pip-btn btn-reset">Reset</button>
                    </div>
                </div>

                <div id="pip-settings-view">
                    <div class="pip-inputs-row">
                        <div class="pip-input-col">
                            <label>Hours</label>
                            <input type="number" id="pip-h" min="0" max="99" value="0">
                        </div>
                        <span class="pip-colon">:</span>
                        <div class="pip-input-col">
                            <label>Minutes</label>
                            <input type="number" id="pip-m" min="0" max="59" value="0">
                        </div>
                        <span class="pip-colon">:</span>
                        <div class="pip-input-col">
                            <label>Seconds</label>
                            <input type="number" id="pip-s" min="0" max="59" value="0">
                        </div>
                    </div>
                    <div class="pip-controls" style="margin-top: 6px;">
                        <button id="pip-save" class="pip-btn btn-start" style="padding: 4px 16px;">Save</button>
                        <button id="pip-cancel" class="pip-btn btn-stop" style="padding: 4px 16px;">Cancel</button>
                    </div>
                </div>
            `;

            var pipDoc = pipWindow.document;
            var pipMainView = pipDoc.getElementById('pip-main-view');
            var pipSettingsView = pipDoc.getElementById('pip-settings-view');
            var pipToggleBtn = pipDoc.getElementById('pip-toggle-settings');

            pipDoc.getElementById('pip-start').addEventListener('click', startTimer);
            pipDoc.getElementById('pip-stop').addEventListener('click', stopTimer);
            pipDoc.getElementById('pip-reset').addEventListener('click', resetTimer);

            function showSettings() {
                pipDoc.getElementById('pip-h').value = document.getElementById('timer-hours').value || 0;
                pipDoc.getElementById('pip-m').value = document.getElementById('timer-minutes').value || 0;
                pipDoc.getElementById('pip-s').value = document.getElementById('timer-seconds').value || 0;
                pipMainView.style.display = 'none';
                pipSettingsView.style.display = 'flex';
                pipToggleBtn.textContent = '✕ Close';
            }

            function hideSettings() {
                pipSettingsView.style.display = 'none';
                pipMainView.style.display = 'block';
                pipToggleBtn.innerHTML = '&#9881; Set Time';
            }

            pipToggleBtn.addEventListener('click', function() {
                if (pipSettingsView.style.display === 'flex') {
                    hideSettings();
                } else {
                    showSettings();
                }
            });

            pipDoc.getElementById('pip-cancel').addEventListener('click', hideSettings);

            pipDoc.getElementById('pip-save').addEventListener('click', function() {
                var h = pipDoc.getElementById('pip-h').value;
                var m = pipDoc.getElementById('pip-m').value;
                var s = pipDoc.getElementById('pip-s').value;
                if (setTimerValue(h, m, s)) {
                    hideSettings();
                }
            });

            // Sync timer text to PiP window
            pipRenderInterval = setInterval(function() {
                if (pipWindow && !pipWindow.closed) {
                    var el = pipDoc.getElementById('pip-timer');
                    if (el) el.textContent = timerElement.textContent;
                } else {
                    clearInterval(pipRenderInterval);
                }
            }, 200);

            pipWindow.addEventListener('pagehide', function() {
                clearInterval(pipRenderInterval);
                pipWindow = null;
            });
        } catch (e) {
            console.error('Document PiP failed:', e);
            // Fallback
            if (document.pictureInPictureEnabled) {
                openVideoPiP();
            } else {
                openPopupOverlay();
            }
        }
    }

    // === Method 2: Video Picture-in-Picture (canvas-based fallback) ===
    function openVideoPiP() {
        if (pipCanvas) {
            // Already running, close it
            if (pipVideo && document.pictureInPictureElement) {
                document.exitPictureInPicture();
            }
            cleanupVideoPiP();
            return;
        }

        pipCanvas = document.createElement('canvas');
        pipCanvas.width = 480;
        pipCanvas.height = 180;
        var ctx = pipCanvas.getContext('2d');

        function renderFrame() {
            // Background
            ctx.fillStyle = '#16898A';
            ctx.fillRect(0, 0, 480, 180);

            // Timer text
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 72px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(timerElement.textContent, 240, 100);

            // Label
            ctx.font = '16px Arial, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText('COUNTDOWN TIMER', 240, 30);
        }

        renderFrame();
        pipRenderInterval = setInterval(renderFrame, 200);

        pipVideo = document.createElement('video');
        pipVideo.srcObject = pipCanvas.captureStream(5);
        pipVideo.muted = true;
        pipVideo.style.display = 'none';
        document.body.appendChild(pipVideo);

        pipVideo.play().then(function() {
            return pipVideo.requestPictureInPicture();
        }).catch(function(e) {
            console.error('Video PiP failed:', e);
            cleanupVideoPiP();
            openPopupOverlay();
        });

        pipVideo.addEventListener('leavepictureinpicture', function() {
            cleanupVideoPiP();
        });
    }

    function cleanupVideoPiP() {
        clearInterval(pipRenderInterval);
        if (pipVideo) {
            pipVideo.remove();
            pipVideo = null;
        }
        pipCanvas = null;
    }

    // === Method 3: Popup window fallback (with buttons and settings) ===
    function openPopupOverlay() {
        var w = 420;
        var h = 220;
        var left = screen.width - w - 20;
        var top = 20;
        var popup = window.open('', 'TimerOverlay',
            'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
            ',toolbar=no,menubar=no,scrollbars=no,resizable=yes');

        if (!popup) {
            alert('Please allow pop-ups for this site to use the overlay feature.');
            return;
        }

        popup.document.write(`
            <!DOCTYPE html>
            <html><head><title>Timer Overlay</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    background: linear-gradient(-45deg, #7DDA58, #16898A, #50CA45, #CECECE);
                    background-size: 400% 400%;
                    animation: gradient 15s ease infinite;
                    height: 100vh;
                    overflow: hidden;
                    font-family: 'Segoe UI', Arial, sans-serif;
                    display: flex;
                    flex-direction: column;
                    padding: 8px 12px;
                    user-select: none;
                }
                @keyframes gradient {
                    0% { background-position: 0% 50%; }
                    50% { background-position: 100% 50%; }
                    100% { background-position: 0% 50%; }
                }
                .pip-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    width: 100%;
                    flex-shrink: 0;
                }
                .pip-title {
                    font-size: 11px;
                    font-weight: bold;
                    letter-spacing: 1px;
                    color: rgba(255,255,255,0.85);
                }
                .pip-settings-btn {
                    background: rgba(255,255,255,0.2);
                    border: 1px solid rgba(255,255,255,0.4);
                    color: white;
                    border-radius: 4px;
                    padding: 3px 8px;
                    font-size: 11px;
                    cursor: pointer;
                }
                #pop-main {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    width: 100%;
                    min-height: 0;
                }
                #t {
                    flex: 1;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: clamp(48px, 18vw, 76px);
                    font-weight: bold;
                    color: white;
                    text-shadow: 0 0 14px rgba(0,0,0,0.4);
                    text-align: center;
                    line-height: 1;
                    width: 100%;
                    margin: 0;
                }
                .pip-controls {
                    display: flex;
                    justify-content: center;
                    gap: 10px;
                    margin-bottom: 2px;
                    flex-shrink: 0;
                }
                .pip-btn {
                    border: none;
                    border-radius: 5px;
                    color: white;
                    font-weight: bold;
                    font-size: 13px;
                    padding: 6px 16px;
                    cursor: pointer;
                }
                .btn-start { background-color: #00827F; }
                .btn-stop { background-color: #F75D59; }
                .btn-reset { background-color: #FBB917; }
                #pop-settings {
                    display: none;
                    flex-direction: column;
                    align-items: center;
                    gap: 6px;
                }
                .pop-row {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                }
                .pop-col {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
                .pop-col label {
                    font-size: 10px;
                    color: white;
                    font-weight: bold;
                }
                .pop-col input {
                    width: 48px;
                    height: 30px;
                    text-align: center;
                    font-size: 16px;
                    border: 2px solid #b2f308;
                    border-radius: 4px;
                }
            </style></head><body>
            <div class="pip-header">
                <span class="pip-title">COUNTDOWN TIMER</span>
                <button id="pop-toggle" class="pip-settings-btn">&#9881; Set Time</button>
            </div>
            <div id="pop-main">
                <div id="t">${timerElement.textContent}</div>
                <div class="pip-controls">
                    <button id="p-start" class="pip-btn btn-start">Start</button>
                    <button id="p-stop" class="pip-btn btn-stop">Stop</button>
                    <button id="p-reset" class="pip-btn btn-reset">Reset</button>
                </div>
            </div>
            <div id="pop-settings">
                <div class="pop-row">
                    <div class="pop-col"><label>Hours</label><input type="number" id="ph" min="0" max="99" value="0"></div>
                    <span style="color:white;font-weight:bold;margin-top:10px;">:</span>
                    <div class="pop-col"><label>Minutes</label><input type="number" id="pm" min="0" max="59" value="0"></div>
                    <span style="color:white;font-weight:bold;margin-top:10px;">:</span>
                    <div class="pop-col"><label>Seconds</label><input type="number" id="ps" min="0" max="59" value="0"></div>
                </div>
                <div class="pip-controls" style="margin-top:6px;">
                    <button id="p-save" class="pip-btn btn-start" style="padding:4px 14px;">Save</button>
                    <button id="p-cancel" class="pip-btn btn-stop" style="padding:4px 14px;">Cancel</button>
                </div>
            </div>
            </body></html>
        `);
        popup.document.close();

        var pDoc = popup.document;
        pDoc.getElementById('p-start').onclick = startTimer;
        pDoc.getElementById('p-stop').onclick = stopTimer;
        pDoc.getElementById('p-reset').onclick = resetTimer;

        pDoc.getElementById('pop-toggle').onclick = function() {
            var s = pDoc.getElementById('pop-settings');
            var m = pDoc.getElementById('pop-main');
            if (s.style.display === 'flex') {
                s.style.display = 'none';
                m.style.display = 'block';
                this.innerHTML = '&#9881; Set Time';
            } else {
                pDoc.getElementById('ph').value = document.getElementById('timer-hours').value || 0;
                pDoc.getElementById('pm').value = document.getElementById('timer-minutes').value || 0;
                pDoc.getElementById('ps').value = document.getElementById('timer-seconds').value || 0;
                m.style.display = 'none';
                s.style.display = 'flex';
                this.textContent = '✕ Close';
            }
        };

        pDoc.getElementById('p-cancel').onclick = function() {
            pDoc.getElementById('pop-settings').style.display = 'none';
            pDoc.getElementById('pop-main').style.display = 'block';
            pDoc.getElementById('pop-toggle').innerHTML = '&#9881; Set Time';
        };

        pDoc.getElementById('p-save').onclick = function() {
            var h = pDoc.getElementById('ph').value;
            var m = pDoc.getElementById('pm').value;
            var s = pDoc.getElementById('ps').value;
            if (setTimerValue(h, m, s)) {
                pDoc.getElementById('pop-settings').style.display = 'none';
                pDoc.getElementById('pop-main').style.display = 'block';
                pDoc.getElementById('pop-toggle').innerHTML = '&#9881; Set Time';
            }
        };

        var popupInterval = setInterval(function() {
            if (popup.closed) {
                clearInterval(popupInterval);
                return;
            }
            try {
                popup.document.getElementById('t').textContent = timerElement.textContent;
            } catch(e) {
                clearInterval(popupInterval);
            }
        }, 200);
    }

    // ===== Register Service Worker for PWA =====
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('Service Worker registered:', reg.scope);
        }).catch(function(err) {
            console.log('Service Worker registration failed:', err);
        });
    }
</script>
